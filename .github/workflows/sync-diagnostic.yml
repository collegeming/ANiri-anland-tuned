# One-off diagnostic v2: print actual conflict-marker regions per file.
name: ANiri sync diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_REPO: niri-wm/niri
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: anland-poll-optimize
  ORPHAN_ROOT: 1a33594f42efef6415096de504214269d82c247d
  BASELINE_COMMIT: 8ed0da44d974c32c6877d2f4630c314da0717ecb

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          show-progress: false

      - name: Fetch upstream & graft
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          git replace --graft "$ORPHAN_ROOT" "$BASELINE_COMMIT"

      - name: Attempt rebase
        run: |
          set +e
          git rebase "upstream/$UPSTREAM_BRANCH" >/tmp/rebase.log 2>&1
          cat /tmp/rebase.log
          echo "REBASE_RC=$?" >> "$GITHUB_ENV"
          exit 0

      - name: Dump conflict-marker regions
        run: |
          set +e
          files=$(git diff --name-only --diff-filter=U)
          echo "Conflicted files: $(echo "$files" | wc -l)"
          echo "$files" | while read -r f; do
            [ -z "$f" ] && continue
            echo ""
            echo "############### FILE: $f ################"
            # Print each conflict block with 10 lines of context before/after.
            grep -n -E '^(<<<<<<<|=======|>>>>>>>)' "$f" | while read -r m; do
              ln=${m%%:*}
              echo "--- marker block @ line $ln ---"
              sed -n "$((ln-10)),$((ln+60))p" "$f"
              echo "<<< end block >>>"
            done
          done
          exit 0
