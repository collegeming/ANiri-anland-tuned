# One-off (merge mode): graft v26.04 baseline, MERGE niri-wm/niri:main into
# anland-poll-optimize, resolve known conflicts mechanically, verify with
# cargo check, push a resolution branch + PR. Does not touch the main branch.
name: ANiri sync resolve (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: niri-wm/niri
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: anland-poll-optimize
  ORPHAN_ROOT: 1a33594f42efef6415096de504214269d82c247d
  BASELINE_COMMIT: 8ed0da44d974c32c6877d2f4630c314da0717ecb

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          show-progress: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream & graft baseline
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          git replace --graft "$ORPHAN_ROOT" "$BASELINE_COMMIT"
          echo "UPSTREAM_SHA=$(git rev-parse upstream/$UPSTREAM_BRANCH)" >> "$GITHUB_ENV"
          echo "UPSTREAM_SHORT=$(git rev-parse --short=12 upstream/$UPSTREAM_BRANCH)" >> "$GITHUB_ENV"
          echo "TARGET_SHA=$(git rev-parse $TARGET_BRANCH)" >> "$GITHUB_ENV"

      - name: Write conflict resolver
        run: |
          cat > /tmp/resolve.py <<'PY'
          import re, sys
          path = sys.argv[1]
          with open(path, encoding='utf-8', errors='surrogateescape') as f:
              text = f.read()
          pat = re.compile(r'<<<<<<< [^\n]*\n(.*?)=======\n(.*?)>>>>>>> [^\n]*\n', re.S)
          unknown = []
          def repl(m):
              head = m.group(1)
              theirs = m.group(2)
              # xdg_activate rename (bool -> enum): take upstream (HEAD) side.
              if 'focus_on_xdg_activate' in theirs or 'focus-on-xdg-activate' in theirs:
                  return head
              # anland backend import: keep anland's Backend import + upstream's use lines.
              if 'use crate::backend::Backend;' in theirs:
                  return 'use crate::backend::Backend;\n' + head
              # Cargo.lock: anland added "cc" build dep; keep it.
              if ' "cc",' in theirs and ' "cc",' not in head:
                  return theirs
              unknown.append((head, theirs))
              return m.group(0)
          new = pat.sub(repl, text)
          if unknown:
              print(f"=== UNRESOLVED in {path} ({len(unknown)} block(s)) ===", file=sys.stderr)
              for i,(h,t) in enumerate(unknown,1):
                  print(f"--- block {i} HEAD ---\n{h}", file=sys.stderr)
                  print(f"--- block {i} ANLAND ---\n{t}", file=sys.stderr)
              sys.exit(2)
          with open(path, 'w', encoding='utf-8', errors='surrogateescape') as f:
              f.write(new)
          PY

      - name: Merge upstream with resolution
        id: merge
        run: |
          set +e
          git merge "upstream/$UPSTREAM_BRANCH" --no-edit >/tmp/merge.log 2>&1
          cat /tmp/merge.log
          if git status | grep -q "All conflict"; then :; fi
          # Resolve conflicts in a loop until stable.
          for round in 1 2 3 4 5; do
            conflicted=$(git diff --name-only --diff-filter=U)
            if [ -z "$conflicted" ]; then break; fi
            echo "===== merge conflict round $round: $conflicted ====="
            ok=1
            for f in $conflicted; do
              if python3 /tmp/resolve.py "$f" 2>/tmp/unresolved.err; then
                git add "$f"
              else
                cat /tmp/unresolved.err
                ok=0
              fi
            done
            if [ $ok -ne 1 ]; then
              echo "MERGE_STATUS=unresolved" >> "$GITHUB_ENV"
              git merge --abort
              exit 0
            fi
          done
          # Commit the merge if resolved.
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "MERGE_STATUS=unresolved" >> "$GITHUB_ENV"
            git merge --abort
            exit 0
          fi
          git commit --no-edit >/dev/null 2>&1 || true
          echo "MERGE_STATUS=done" >> "$GITHUB_ENV"
          echo "MERGE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install build deps for cargo check
        if: env.MERGE_STATUS == 'done'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwayland-dev libinput-dev libudev-dev \
            libdbus-1-dev libpango1.0-dev libglib2.0-dev libdrm-dev \
            libdisplay-info-dev libxkbcommon-dev libpixman-1-dev libpipewire-0.3-dev \
            libegl1-mesa-dev libgles2-mesa-dev libgbm-dev
          rustup init -y --default-toolchain stable --profile minimal 2>/dev/null || true
          source "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version

      - name: cargo check (verification gate)
        id: check
        if: env.MERGE_STATUS == 'done'
        run: |
          source "$HOME/.cargo/env"
          cargo check --workspace --all-targets 2>&1 | tee /tmp/cargo-check.log
          echo "CARGO_CHECK=pass" >> "$GITHUB_ENV"
        continue-on-error: true

      - name: Push resolution branch & PR
        if: env.MERGE_STATUS == 'done'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BR="sync/resolve-${UPSTREAM_SHORT}"
          git branch -f "$BR" HEAD
          git checkout "$BR"
          rm -rf .github/workflows
          git checkout "$TARGET_BRANCH" -- .github/workflows
          git add .github/workflows
          git commit -m "chore(sync-resolve): keep fork workflow files" --no-verify >/dev/null || true
          git push --force origin "$BR"
          if [ "${CARGO_CHECK:-}" = "pass" ]; then status="compiles ✓"; else status="cargo check FAILED (see log tail)"; fi
          LOG_TAIL=$(tail -80 /tmp/cargo-check.log 2>/dev/null | sed 's/`//g' | sed 's/$/<br>/')
          cat > /tmp/pr_body.md <<EOF
          One-off resolution of the first niri-wm/niri upstream sync (merge mode).

          - Upstream: \`$UPSTREAM_REPO@$UPSTREAM_BRANCH\` @ \`$UPSTREAM_SHORT\` ($UPSTREAM_SHA)
          - Target (before): \`$TARGET_BRANCH\` @ \`$TARGET_SHA\`
          - Baseline graft: \`$BASELINE_COMMIT\` (niri v26.04)
          - Verification: **$status**

          Resolution rules (all conflicts stem from niri renaming \`focus-on-xdg-activate\` (bool) -> \`on-xdg-activate\` (enum) since v26.04):
          - xdg-activate conflicts (lib.rs, window_rule.rs, window/mod.rs, handlers xdg blocks, docs) -> took upstream
          - \`use crate::backend::Backend;\` (anland) -> kept, plus upstream's use lines
          - \` "cc",\` in Cargo.lock (anland build dep) -> kept

          After merge, anland-poll-optimize gains real niri ancestry and the daily sync runs clean.
          EOF
          if [ "$status" != "compiles ✓" ]; then
            echo "" >> /tmp/pr_body.md
            echo '```' >> /tmp/pr_body.md
            tail -80 /tmp/cargo-check.log 2>/dev/null >> /tmp/pr_body.md
            echo '```' >> /tmp/pr_body.md
          fi
          existing=$(gh pr list --base "$TARGET_BRANCH" --head "$BR" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh pr comment "$existing" --body "Re-ran sync-resolve: $status"
          else
            gh pr create --base "$TARGET_BRANCH" --head "$BR" \
              --title "sync-resolve: merge $UPSTREAM_REPO@$UPSTREAM_SHORT into anland-poll-optimize" \
              --body-file /tmp/pr_body.md || \
            echo "PR_CREATE_BLOCKED: https://github.com/${GITHUB_REPOSITORY}/compare/${TARGET_BRANCH}...${BR}"
          fi
          echo "RES_BRANCH=$BR" >> "$GITHUB_ENV"

      - name: Unresolved-conflict notice
        if: env.MERGE_STATUS == 'unresolved'
        run: |
          BR="sync/resolve-${UPSTREAM_SHORT}"
          COMPARE="https://github.com/${GITHUB_REPOSITORY}/compare/${TARGET_BRANCH}...${UPSTREAM_SHORT}"
          echo "::warning::Merge had unresolvable conflicts. See run log for unknown blocks. Compare: $COMPARE"
          echo "RES_BRANCH=$BR" >> "$GITHUB_ENV"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Sync-resolve (merge) summary"
            echo ""
            echo "- Upstream: \`$UPSTREAM_REPO@$UPSTREAM_BRANCH\` @ \`$UPSTREAM_SHORT\`"
            echo "- Merge: ${MERGE_STATUS:-unknown}"
            if [ "${CARGO_CHECK:-}" = "pass" ]; then echo "- cargo check: ✓"; fi
            if [ -n "${RES_BRANCH:-}" ]; then
              echo "- Branch: \`$RES_BRANCH\`"
              echo "- Compare: https://github.com/${GITHUB_REPOSITORY}/compare/${TARGET_BRANCH}...${RES_BRANCH}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
