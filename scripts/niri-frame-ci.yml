# Publish only as .github/workflows/ci.yml on ci/frame-callback-diag.
name: niri frame callback ARM64 diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niri-frame-${{ github.ref }}
  cancel-in-progress: false

env:
  NIRI_COMMIT: 8ed0da44d974c32c6877d2f4630c314da0717ecb
  SMITHAY_COMMIT: ff5fa7df392cecfba049ffed55cdaa4e98a8e7ef
  RUST_VERSION: 1.95.0
  CARGO_TERM_COLOR: always
  ARCH_IMAGE: docker.io/ogarcia/archlinux:latest@sha256:f92ed48cdfc274181f16e94e6a4e90e4c90c59a3d14fc7a133483a93ebc16ec6

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    container:
      image: docker.io/ogarcia/archlinux:latest@sha256:f92ed48cdfc274181f16e94e6a4e90e4c90c59a3d14fc7a133483a93ebc16ec6
    defaults:
      run:
        shell: bash
    steps:
      - name: Install compatible native Arch build dependencies once for both variants
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel binutils clang cmake curl file git pkgconf python rustup \
            dbus wayland wayland-protocols libinput pango glib2 libdisplay-info \
            mesa seatd systemd-libs libdrm libxkbcommon libevdev libwacom lua \
            freetype2 fontconfig libx11 libxcb libffi pcre2 libgudev pixman \
            libxrender libxext xkeyboard-config pipewire libpipewire
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
          rustup default "$RUST_VERSION"
          printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check out reviewed patchers from this isolated branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          path: recipe
          persist-credentials: false
          show-progress: false

      - name: Check out exact upstream niri
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          repository: niri-wm/niri
          ref: 8ed0da44d974c32c6877d2f4630c314da0717ecb
          path: baseline/niri
          persist-credentials: false
          show-progress: false

      - name: Check out exact upstream Smithay
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          repository: Smithay/smithay
          ref: ff5fa7df392cecfba049ffed55cdaa4e98a8e7ef
          path: baseline/smithay
          persist-credentials: false
          show-progress: false

      - name: Verify identities and apply identical local dependency mapping
        run: |
          set -euo pipefail
          # Only exact Actions-created checkouts are trusted.
          for p in recipe baseline/niri baseline/smithay; do
            git config --global --add safe.directory "$GITHUB_WORKSPACE/$p"
          done
          test "$(git -C baseline/niri rev-parse HEAD)" = "$NIRI_COMMIT"
          test "$(git -C baseline/smithay rev-parse HEAD)" = "$SMITHAY_COMMIT"
          test -z "$(git -C baseline/niri status --porcelain)"
          test -z "$(git -C baseline/smithay status --porcelain)"
          mkdir diagnostic dist
          cp -a baseline/niri diagnostic/niri
          cp -a baseline/smithay diagnostic/smithay
          for p in diagnostic/niri diagnostic/smithay; do
            git config --global --add safe.directory "$GITHUB_WORKSPACE/$p"
          done
          python3 -I recipe/scripts/niri-frame-patch.py "$GITHUB_WORKSPACE/baseline/niri" --mode baseline
          python3 -I recipe/scripts/niri-frame-patch.py "$GITHUB_WORKSPACE/diagnostic/niri" --mode diagnostic
          python3 -I recipe/scripts/niri-frame-smithay-patch.py "$GITHUB_WORKSPACE/diagnostic/smithay"
          cmp baseline/niri/Cargo.toml diagnostic/niri/Cargo.toml
          cmp baseline/niri/Cargo.lock diagnostic/niri/Cargo.lock
          git -C baseline/niri diff -- Cargo.toml Cargo.lock > dist/local-dependency.patch
          git -C diagnostic/niri diff -- src/niri.rs src/backend/winit.rs > dist/niri-diagnostic.patch
          git -C diagnostic/smithay diff -- src/desktop/wayland/utils.rs > dist/smithay-diagnostic.patch
          test -s dist/local-dependency.patch
          test -s dist/niri-diagnostic.patch
          test -s dist/smithay-diagnostic.patch
          cp baseline/niri/Cargo.lock dist/Cargo.lock
          cp baseline/niri/LICENSE dist/LICENSE
          cp recipe/scripts/niri-frame-{patch.py,smithay-patch.py,ci.yml} dist/
          printf 'NIRI_FRAME_PREPARE_COMPLETE\n'

      - name: Fetch once, verify frozen dependency graph, and build both binaries
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          export RUSTUP_TOOLCHAIN="$RUST_VERSION"
          cargo fetch --locked --manifest-path baseline/niri/Cargo.toml
          sha256sum baseline/niri/Cargo.lock diagnostic/niri/Cargo.lock > dist/lock-before.txt
          for variant in baseline diagnostic; do
            cargo metadata --frozen --format-version 1 --manifest-path "$variant/niri/Cargo.toml" > "dist/$variant-cargo-metadata.json"
            # Exact blobs establish the formatting baseline; parse all generated Rust,
            # then format only those files (do not reformat unrelated upstream files).
            if [ "$variant" = diagnostic ]; then
              rustfmt --edition 2021 diagnostic/niri/src/niri.rs diagnostic/niri/src/backend/winit.rs
              rustfmt --edition 2024 diagnostic/smithay/src/desktop/wayland/utils.rs
            fi
            NIRI_BUILD_COMMIT="$NIRI_COMMIT" cargo build --frozen --release --bin niri --manifest-path "$variant/niri/Cargo.toml"
            install -m755 "$CARGO_TARGET_DIR/release/niri" "dist/niri-frame-$variant"
            readelf -h "dist/niri-frame-$variant" | grep -Eq 'Machine:[[:space:]]+AArch64'
            "dist/niri-frame-$variant" --version > "dist/$variant-version.txt"
            ldd "dist/niri-frame-$variant" > "dist/$variant-ldd.txt"
            if grep -F 'not found' "dist/$variant-ldd.txt"; then exit 1; fi
            readelf -dW "dist/niri-frame-$variant" > "dist/$variant-dynamic.txt"
          done
          sha256sum --check dist/lock-before.txt
          cmp baseline/niri/Cargo.lock diagnostic/niri/Cargo.lock
          # Preserve the precise compiled patches after formatting.
          git -C diagnostic/niri diff -- src/niri.rs src/backend/winit.rs > dist/niri-diagnostic.patch
          git -C diagnostic/smithay diff -- src/desktop/wayland/utils.rs > dist/smithay-diagnostic.patch
          printf 'NIRI_FRAME_BUILD_COMPLETE\n'

      - name: Verify resolved package identity, record provenance, checksum artifacts
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          from pathlib import Path
          def graph(variant):
              data = json.loads(Path(f'dist/{variant}-cargo-metadata.json').read_text())
              prefix = str(Path(variant).resolve())
              def normalize(value):
                  return value.replace(prefix, '<variant>')
              packages = sorted((normalize(p['id']), p['name'], p['version'], p['source'], normalize(p['manifest_path'])) for p in data['packages'])
              nodes = sorted((normalize(n['id']), sorted(normalize(d) for d in n['dependencies']), sorted(n['features'])) for n in data['resolve']['nodes'])
              return packages, nodes
          assert graph('baseline') == graph('diagnostic'), 'dependency graph mismatch'
          Path('dist/dependency-identity.txt').write_text('baseline and diagnostic resolved packages, dependencies and features identical\n')
          PY
          pacman -Q > dist/build-packages.txt
          rustc -Vv > dist/rustc.txt
          cargo -Vv > dist/cargo.txt
          {
            printf 'NIRI_COMMIT=%s\nSMITHAY_COMMIT=%s\n' "$NIRI_COMMIT" "$SMITHAY_COMMIT"
            printf 'RECIPE_COMMIT=%s\nWORKFLOW_COMMIT=%s\n' "$GITHUB_SHA" '${{ github.workflow_sha }}'
            printf 'ARCH_IMAGE=%s\nRUNNER_ARCH=%s\n' "$ARCH_IMAGE" "$RUNNER_ARCH"
            printf 'TARGET=aarch64-unknown-linux-gnu\nFEATURES=default\nBUILD=cargo build --frozen --release --bin niri\n'
            printf 'GATE=NIRI_FRAME_DIAG=1\nLIMIT=NIRI_FRAME_DIAG_LIMIT (default 2000, max 10000 per component)\n'
            printf 'SCOPE=nested-only; no throttle or scheduling changes; no release/install\n'
          } > dist/BUILD-METADATA.txt
          (cd dist && sha256sum -- * > SHA256SUMS && sha256sum --check SHA256SUMS)
          printf 'NIRI_FRAME_CI_COMPLETE\n'

      - name: Upload binaries and reproducibility metadata only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: niri-frame-arm64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
